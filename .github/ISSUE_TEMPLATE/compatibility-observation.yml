name: Compatibility observation
description: Add a captured a-Shell or platform observation without claiming parity.
title: "compat: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Do not include private data or credentials. Source inspection alone is not a direct behavioral observation.
  - type: input
    id: reference
    attributes:
      label: Reference and version
      placeholder: "a-Shell 1.x, iOS version, or other named reference"
    validations:
      required: true
  - type: input
    id: scenario
    attributes:
      label: Scenario ID
      placeholder: "core.pipeline.basic"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact input
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Captured stdout, stderr, and status
      description: Include the observation from the reference and Rune separately.
    validations:
      required: true
