[workspace]
resolver = "2"
members = [
    "crates/rune-fs",
    "crates/rune-shell",
    "crates/rune-core",
    "crates/rune-package",
    "crates/rune-runtime",
    "crates/rune-wasm",
    "crates/rune-ffi",
    "apps/rune-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OthmaneBlial/Rune"
rust-version = "1.78"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
